name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for all services to start..."
          sleep 15
          docker compose ps

      - name: Test health endpoint
        run: |
          response=$(curl -s http://localhost/health)
          echo "Health check response: $response"
          echo "$response" | grep -q '"status".*"ok"' || (echo "Health check failed!" && exit 1)

      - name: Test home page
        run: |
          response=$(curl -s http://localhost/)
          echo "$response" | grep -q "Flask + PostgreSQL" || (echo "Home page check failed!" && exit 1)

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'DEPLOY'
            cd /root/project-01-flask-docker
            git pull origin main
            docker compose up -d --build
            echo "Deploy completed at $(date)"
          DEPLOY

      - name: Verify deployment
        run: |
          sleep 10
          response=$(curl -s http://${{ secrets.VPS_HOST }}:8080/health)
          echo "Deploy verification: $response"
          echo "$response" | grep -q '"status".*"ok"' || (echo "Deploy verification failed!" && exit 1)
