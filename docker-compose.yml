services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  web:
    build: .
    environment:
      - DB_HOST=db
      - DB_NAME=devops_db
      - DB_USER=devops
      - DB_PASSWORD=secret123
    depends_on:
      - db
    expose:
      - "5000"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=devops_db
      - POSTGRES_USER=devops
      - POSTGRES_PASSWORD=secret123
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
